<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skycast | Weather forecast</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
<main class="container">
    <header><a class="brand" href="./">☀ Skycast</a><span>Your daily weather companion</span></header>
    <section class="intro"><p class="eyebrow">A LITTLE CLARITY FOR YOUR DAY</p><h1>What's the weather like?</h1><p>Find the current weather and plan for the days ahead.</p></section>
    <form id="weather-form" class="search">
        <div><label for="city">City</label><input id="city" name="city" value="Mumbai" placeholder="Enter a city" required maxlength="120"></div>
        <div><label for="days">Forecast</label><select id="days" name="days"><option value="1">1 day</option><option value="2">2 days</option><option value="3" selected>3 days</option></select></div>
        <button id="search-button" type="submit">Get weather →</button>
    </form>
    <p id="status" role="status" aria-live="polite">Search for a city to see its weather.</p>
    <section id="results" hidden aria-label="Weather results">
        <article class="current">
            <div><p class="eyebrow">CURRENT WEATHER</p><h2 id="city-name"></h2><p id="location"></p><p id="condition"></p></div>
            <div class="temperature"><span id="weather-icon" aria-hidden="true"></span><strong id="temperature"></strong></div>
        </article>
        <div class="forecast-heading"><h2>Days ahead</h2><span id="forecast-count"></span></div>
        <div id="forecast" class="forecast"></div>
    </section>
    <footer>Made for your everyday plans · Temperatures in °C</footer>
</main>
</body>
</html>
